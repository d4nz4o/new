    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trilha Participações | Equipe</title>
        <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" href="css/tokens.css">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/topbar.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/equipe.css">

        <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script defer src="js/core/supabase.js"></script>
        <script defer src="js/core/state.js"></script>
        <script defer src="js/core/utils.js"></script>
        <script defer src="js/core/avatar.js"></script>
        <script defer src="js/core/dados.js"></script>
        <script defer src="js/core/usuario.js"></script>
        <script defer src="js/modules/equipe.js"></script>
        <script defer src="js/core/layout.js"></script>
        <script defer src="js/core/busca.js"></script>

    </head>

    <body data-aba="equipe">
        <!-- A topbar é montada por js/core/layout.js -->
        <header class="topbar" id="topbar"></header>

        <main class="content-container">
            <section id="view-equipe" class="view-section active">
                <div class="main-container">
                    <!-- Sidebar Equipe -->
                    <aside class="sidebar">
                        <h2>Equipe</h2>
                        <div class="team-list" id="teamListEquipe">
                            <small style="color:var(--text-muted);">Carregando…</small>
                        </div>
                    </aside>

                    <!-- Painel de Detalhes do Colaborador -->
                    <div class="details-panel" id="colabDetailsPanel">
                        <div class="details-placeholder">
                            <div class="placeholder-icon">🙋🏽‍♀️</div>
                            <h3>Selecione um(a) colaborador(a)</h3>
                            <p>Clique em um(a) colaborador(a) na barra lateral para visualizar suas informações.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <script>function iniciarPagina() { carregarColaboradores(); }</script>
    </body>
</html>
