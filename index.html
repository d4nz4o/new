<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Participações | Controladoria - Login</title>
  <meta name="theme-color" content="#08172b">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

  <!-- Supabase: biblioteca + conexão única do projeto (js/core/supabase.js define sbClient) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core/supabase.js"></script>

  <style>
    :root {
      --bg: #050e1b; --navy: #15385e; --rail: #2573c0; --logo-blue: #3a93dd; --sky: #8cc6f2;
      --ink: #15385e; --ok: #3ddc97; --amber: #ffb84d; --line: #dce5ef;
      --ease: cubic-bezier(.16, .8, .24, 1);
      --porta: cubic-bezier(.65, 0, .2, 1);   /* porta pneumática: arranca, desliza, freia */
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 2px solid var(--logo-blue); outline-offset: 3px; }

    body.login-page {
      margin: 0; min-height: 100svh; position: relative; overflow: hidden;
      display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 0 16px;
      background: var(--bg); color: #fff; -webkit-font-smoothing: antialiased;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    /* ---------- Túnel (canvas) ---------- */
    .tunel { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; animation: acende 1.4s ease backwards; }
    .vinheta { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 70% 62% at 50% 46%, transparent 30%, rgba(3, 8, 18, .8) 100%); }

    /* ---------- Painel de partidas (letras que viram) ---------- */
    .placa {
      position: relative; z-index: 2; margin-top: clamp(14px, 3.4vh, 32px);
      display: flex; align-items: center; gap: 16px; padding: 12px 18px; max-width: 100%;
      background: linear-gradient(#0e1c2f, #08121f); border: 1px solid rgba(140, 198, 242, .26); border-radius: 14px;
      box-shadow: 0 22px 44px -20px #000, inset 0 1px 0 rgba(255, 255, 255, .07);
      animation: desce 1s var(--ease) .2s backwards;
    }
    .linha-selo { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
      background: var(--rail); font-weight: 700; font-size: 1.5rem; box-shadow: 0 0 0 3px #fff, 0 0 26px rgba(58, 147, 221, .65); }
    .flap { display: grid; gap: 6px; min-width: 0; }
    .flap-linha { display: flex; gap: 2px; }
    .cel {
      display: inline-block; width: .74em; height: 1.32em; line-height: 1.32em; text-align: center; position: relative;
      font: 600 1.35rem 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #ffe29a; border-radius: 3px;
      background: linear-gradient(#1c2c40 49%, #0b1623 51%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
    }
    .cel::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .65); }
    .flap-linha:first-child .cel { font-size: .95rem; color: #9ccbee; }
    .cel.vira { animation: vira .3s ease-in-out; }
    .relogio { margin-left: auto; padding-left: 16px; border-left: 1px solid rgba(140, 198, 242, .22);
      font: 600 1.3rem 'IBM Plex Mono', ui-monospace, monospace; color: var(--amber); text-shadow: 0 0 14px rgba(255, 184, 77, .5); }

    /* ---------- Vagão: moldura, portas e cartão ---------- */
    .palco { position: relative; z-index: 2; width: 100%; display: grid; place-items: center; padding: 22px 0; }
    .vagao {
      position: relative; width: min(430px, 100%); padding: 12px; border-radius: 26px;
      background: linear-gradient(160deg, #e3ebf4, #9fb2c7 55%, #c8d5e3);
      box-shadow: 0 56px 90px -34px #000, inset 0 0 0 1px rgba(255, 255, 255, .4), 0 0 90px -12px rgba(58, 147, 221, .4);
      animation: chega 1.7s cubic-bezier(.2, .9, .25, 1) 1.9s backwards;
    }
    .vagao::before { content: ""; position: absolute; left: 26px; right: 26px; top: 0; height: 5px; border-radius: 0 0 6px 6px;
      background: linear-gradient(90deg, var(--rail), var(--logo-blue), var(--rail)); }
    .aviso { position: absolute; left: 50%; top: -5px; width: 56px; height: 8px; border-radius: 99px; translate: -50% -50%;
      background: var(--amber); box-shadow: 0 0 18px 5px rgba(255, 184, 77, .7); animation: aviso .5s steps(1) 6 3.2s backwards; }
    body.partindo .aviso { animation: aviso .4s steps(1) infinite; }

    .vao { position: relative; overflow: hidden; border-radius: 16px; background: #0a1626; }
    .login-card { position: relative; text-align: center; color: var(--ink); background: linear-gradient(#ffffff, #f2f7fc); transition: opacity .5s ease .3s; }
    body.partindo .login-card { opacity: .55; }

    .porta {
      position: absolute; top: 0; bottom: 0; width: 50.4%; z-index: 3; transition: transform 1.3s var(--porta);
      background: linear-gradient(180deg, #eaf1f8 0, #c4d2e0 64%, #8da1b7 64.4%, #6d8197 100%);
    }
    .porta-e { left: 0; transform: translateX(-102%); animation: abreE 1.5s var(--porta) 3.6s backwards; border-right: 1px solid #738699; }
    .porta-d { right: 0; transform: translateX(102%);  animation: abreD 1.5s var(--porta) 3.6s backwards; border-left: 1px solid #738699; }
    body.partindo .porta-e, body.partindo .porta-d { transform: none; }
    .vidro { position: absolute; left: 15%; right: 15%; top: 9%; height: 44%; border-radius: 12px; overflow: hidden;
      background: linear-gradient(160deg, #1a3555, #09131f 62%); box-shadow: inset 0 0 0 3px #8497ac, inset 0 0 34px rgba(0, 0, 0, .65); }
    .vidro::after { content: ""; position: absolute; inset: -30%; background: linear-gradient(110deg, transparent 40%, rgba(255, 255, 255, .17) 46%, transparent 53%); animation: reflexo 7s linear infinite; }
    .borracha { position: absolute; top: 0; bottom: 0; width: 10px; background: linear-gradient(90deg, #0d1622, #26384d); }
    .porta-e .borracha { right: 0; } .porta-d .borracha { left: 0; }
    .porta::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 7%; height: 6px; border-radius: 3px; background: repeating-linear-gradient(135deg, #f6c343 0 8px, #24303d 8px 16px); }

    /* ---------- Plataforma ---------- */
    .plataforma { position: relative; z-index: 2; width: 100vw; height: 66px; margin-top: auto; animation: sobe 1s var(--ease) 2s backwards;
      background: linear-gradient(180deg, rgba(11, 28, 51, 0), #0c1e38 62%); }
    .plataforma::before { content: ""; position: absolute; left: 0; right: 0; bottom: 20px; height: 14px; opacity: .9;
      background: radial-gradient(circle 3px at 8px 7px, #f6c343 98%, transparent) 0 0 / 16px 14px repeat-x; }
    .plataforma::after { content: ""; position: absolute; left: 0; right: 0; bottom: 36px; height: 2px; background: #f6c343; opacity: .85; box-shadow: 0 0 16px #f6c343; }
.login-header { padding: 2.4rem 2rem 1.4rem; }

    .login-logo {
      max-width: 170px; height: auto; margin-bottom: 1.1rem; cursor: pointer;
      transition: opacity .2s ease, transform .25s var(--ease);
    }
    .login-logo:hover { opacity: .85; transform: scale(1.03); }

    .login-titulo { margin: 0 0 6px; font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }
    .login-subtitle { color: #64748b; font-size: .93rem; margin: 0; line-height: 1.45; }

    .login-corpo { padding: 0 2rem 1.6rem; }

    .btn-google {
      position: relative; overflow: hidden;
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: #fff; color: #1e293b;
      border: 1px solid #cbd5e1; border-radius: 10px;
      padding: 13px 16px;
      font: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
      transition: transform .22s var(--ease), box-shadow .22s ease, border-color .22s ease, background-color .22s ease;
    }
    /* brilho que varre o botão */
    .btn-google::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
      background: linear-gradient(100deg, transparent, rgba(58, 147, 221, .18), transparent);
      transform: skewX(-18deg);
      transition: left .6s var(--ease);
    }
    .btn-google:hover { background: #f8fbff; border-color: var(--logo-blue); transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(37, 115, 192, .5); }
    .btn-google:hover::before { left: 120%; }
    .btn-google:active { transform: translateY(0); }
    .btn-google svg { flex: none; }

    .btn-google .seta { margin-left: auto; width: 18px; height: 18px; stroke: #7a8fa6; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s var(--ease), stroke .22s ease; }
    .btn-google:hover .seta { transform: translateX(4px); stroke: var(--rail); }

    /* carregando: um trem percorre a base do botão */
    .btn-google .progresso { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; opacity: 0; transition: opacity .2s; }
    .btn-google .progresso::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 38%;
      background: linear-gradient(90deg, transparent, var(--logo-blue), var(--rail));
      border-radius: 3px;
      animation: trem-btn 1s var(--ease) infinite;
    }
    .btn-google.carregando { pointer-events: none; opacity: .92; }
    .btn-google.carregando .progresso { opacity: 1; }
    .btn-google.carregando .seta { display: none; }

    .botoes { display: grid; gap: 12px; }

    .error-message {
      display: none;
      background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
      padding: 10px 12px; border-radius: 8px;
      font-size: .85rem; margin-bottom: 1rem; text-align: left;
    }
    .error-message.visivel { display: block; animation: treme .4s ease; }

    .login-footer {
      height: 70px;
      display: grid; place-items: center;
      padding: 0 2rem;
      border-top: 2px dashed #d3deea;
      color: #5f7389; font-size: .8rem;
    }

    
    .login-card .entra { animation: entra .8s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 90ms + 3.9s); }
    .login-header { padding: 2.2rem 2rem 1.3rem; }

    @keyframes acende { from { opacity: 0; } }
    @keyframes desce  { from { opacity: 0; transform: translateY(-26px); } }
    @keyframes sobe   { from { opacity: 0; transform: translateY(40px); } }
    @keyframes chega  { 0% { opacity: 0; transform: translateY(-14px) scale(.62); filter: blur(10px); } 35% { opacity: 1; } 100% { transform: none; filter: none; } }
    @keyframes abreE  { from { transform: translateX(0); } }
    @keyframes abreD  { from { transform: translateX(0); } }
    @keyframes aviso  { 50% { opacity: .15; } }
    @keyframes vira   { 0%, 100% { transform: rotateX(0); } 50% { transform: rotateX(-88deg); } }
    @keyframes reflexo { to { transform: translateX(34%); } }
    @keyframes entra  { from { opacity: 0; transform: translateY(14px); } }
    @keyframes trem-btn { from { left: -40%; } to { left: 102%; } }
    @keyframes treme  { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

    @media (max-width: 900px) {
      .placa { padding: 10px 12px; gap: 10px; } .linha-selo { width: 38px; height: 38px; font-size: 1.2rem; }
      .cel { font-size: .98rem; } .flap-linha:first-child .cel { font-size: .72rem; } .relogio { display: none; }
    }
    @media (max-height: 700px) { .palco { padding: 10px 0; } .login-header { padding-top: 1.4rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="login-page">

  <canvas class="tunel" aria-hidden="true"></canvas>
  <div class="vinheta" aria-hidden="true"></div>

  <!-- Painel de partidas -->
  <header class="placa" role="img" aria-label="Próxima parada: Controladoria Trilha. Tudo em um só trilho.">
    <span class="linha-selo" aria-hidden="true">1</span>
    <div class="flap" aria-hidden="true">
      <div class="flap-linha" data-n="16"></div>
      <div class="flap-linha" data-n="22"></div>
    </div>
    <time class="relogio" id="relogio" aria-hidden="true">--:--</time>
  </header>

  <!-- Vagão: o cartão de acesso fica atrás das portas -->
  <main class="palco">
    <div class="vagao">
      <span class="aviso" aria-hidden="true"></span>
      <div class="vao">
        <div class="login-card">
      <div class="login-header">
        <img
          src="assets/images/logo.png"
          alt="Trilha Participações"
          class="login-logo entra"
          style="--i:2"
          onclick="window.location.href='index.html'"
        />
        <h1 class="login-titulo entra" style="--i:3">Embarque no sistema</h1>
        <p class="login-subtitle entra" style="--i:4">Acesse com a sua conta corporativa.</p>
      </div>

      <div class="login-corpo entra" style="--i:5">
        <!-- Mensagem de erro -->
        <div id="mensagemErro" class="error-message" role="alert"></div>

        <div class="botoes">
        <button type="button" id="btnGoogle" class="btn-google" onclick="fazerLoginComGoogle()">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span id="btnTexto">Entrar com o Google</span>
          <svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span class="progresso" aria-hidden="true"></span>
        </button>

        <!-- Microsoft -->
        <button type="button" id="btnMicrosoft" class="btn-google btn-microsoft" onclick="fazerLoginComMicrosoft()">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="1" y="1" width="10.5" height="10.5" fill="#F25022"/>
            <rect x="12.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/>
            <rect x="1" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/>
            <rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/>
          </svg>
          <span id="btnTextoMs">Entrar com a Microsoft</span>
          <svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span class="progresso" aria-hidden="true"></span>
        </button>
        </div>
      </div>

      <div class="login-footer entra" style="--i:6">
        Sistema criado pela Controladoria da Trilha.
      </div>
        </div>
        <div class="porta porta-e" aria-hidden="true"><div class="vidro"></div><i class="borracha"></i></div>
        <div class="porta porta-d" aria-hidden="true"><div class="vidro"></div><i class="borracha"></i></div>
      </div>
    </div>
  </main>

  <div class="plataforma" aria-hidden="true"></div>

<script>

  const DOMINIO_CORPORATIVO = "triviatrens.com.br";

  const BOTOES = {
    google:    { btn: 'btnGoogle',    txt: 'btnTexto',   padrao: 'Entrar com o Google' },
    microsoft: { btn: 'btnMicrosoft', txt: 'btnTextoMs', padrao: 'Entrar com a Microsoft' }
  };

  // Marca o botão do provedor escolhido como "Embarcando…" e trava os dois enquanto o login inicia
  function definirCarregando(ativo, provedor) {
    Object.entries(BOTOES).forEach(([nome, cfg]) => {
      const btn = document.getElementById(cfg.btn);
      const txt = document.getElementById(cfg.txt);
      if (!btn || !txt) return;
      const escolhido = ativo && nome === provedor;
      btn.classList.toggle('carregando', escolhido);
      btn.disabled = ativo;
      txt.textContent = escolhido ? 'Embarcando…' : cfg.padrao;
    });
    document.body.classList.toggle('partindo', ativo);
    document.dispatchEvent(new CustomEvent('embarque', { detail: ativo }));
  }

  async function iniciarLogin(provedor, provider, opcoesExtras) {
    if (!sbClient) {
      exibirErro("Erro ao conectar ao serviço de autenticação.");
      return;
    }

    definirCarregando(true, provedor);

    // Redireciona o utilizador logado diretamente para hub.html (funciona também na raiz do domínio)
    const urlRedirecionamento = new URL('hub.html', window.location.href).href;

    const { data, error } = await sbClient.auth.signInWithOAuth({
      provider: provider,
      options: Object.assign({ redirectTo: urlRedirecionamento }, opcoesExtras)
    });

    if (error) {
      console.error("Erro na autenticação:", error.message);
      definirCarregando(false);
      exibirErro("Falha ao iniciar o login. Tente novamente.");
    }
  }

  function fazerLoginComGoogle() {
    // "hd": dica ao Google para listar só contas do domínio corporativo (a validação real continua no servidor)
    return iniciarLogin('google', 'google', { queryParams: { hd: DOMINIO_CORPORATIVO } });
  }

  function fazerLoginComMicrosoft() {
    // O Supabase exige que a Microsoft devolva o e-mail, por isso o escopo "email"
    return iniciarLogin('microsoft', 'azure', { scopes: 'email' });
  }

  function exibirErro(mensagem) {
    const elErro = document.getElementById('mensagemErro');
    if (elErro) {
      elErro.innerText = mensagem;
      elErro.classList.remove('visivel');
      void elErro.offsetWidth; // reinicia a animação
      elErro.classList.add('visivel');
    }
  }

  // Ao voltar pelo botão do navegador, a página não pode ficar travada no estado "embarcando"
  window.addEventListener('pageshow', () => definirCarregando(false));

  document.addEventListener("DOMContentLoaded", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('erro') === 'dominio_invalido') {
      exibirErro("Acesso negado! Utilize uma conta corporativa da Trilha.");
    } else if (urlParams.get('erro') === 'inatividade') {
      exibirErro("Sua sessão foi encerrada por inatividade. Entre novamente.");
    }

    if (sbClient) {
      const { data: { session } } = await sbClient.auth.getSession();

      if (!session) {
        // Sem sessão: zera o relógio de inatividade para o próximo login começar do zero
        try { localStorage.removeItem('trilha_atividade'); } catch {}
      }

      if (session) {
        const email = (session.user.email || "").toLowerCase();

        if (!email.endsWith("@" + DOMINIO_CORPORATIVO)) {
          await sbClient.auth.signOut();
          exibirErro("Acesso negado: utilize uma conta corporativa da Trilha.");
          return;
        }

        // Se estiver autenticado e com e-mail correto, envia para o painel (hub.html)
        window.location.href = "hub.html";
      }
    }
  });

  /* ================= Animações (somente visual) ================= */
  const REDUZ = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOBILE = window.matchMedia('(max-width: 900px)').matches;

  /* Túnel de metrô em perspectiva (canvas 2D). A velocidade conta a história:
     entra rápido, freia até parar na estação, e acelera de novo ao embarcar. */
  (() => {
    const cv = document.querySelector('.tunel'); if (!cv) return;
    const ctx = cv.getContext('2d'); if (!ctx) return;
    const DPR = Math.min(window.devicePixelRatio || 1, MOBILE ? 1 : 1.5);
    const N = MOBILE ? 14 : 22, GAP = .25;
    let W = 0, H = 0, off = 0, idx = 0, v = REDUZ ? .12 : 3.6, alvo = .12, k = 1.15, px = 0, py = 0, ax = 0, ay = 0, ult = 0, vivo = true;

    const ajusta = () => {
      W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#050e1b'; ctx.fillRect(0, 0, W, H);
    };
    const caixa = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
    const luz = (x, y, r, cor, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, `rgba(${cor},${a})`); g.addColorStop(1, `rgba(${cor},0)`); ctx.fillStyle = g; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8); };

    const quadro = (dt) => {
      v += (alvo - v) * (1 - Math.exp(-dt * k));
      off += v * dt; while (off >= GAP) { off -= GAP; idx++; }
      ax += (px - ax) * .06; ay += (py - ay) * .06;
      ctx.fillStyle = `rgba(5,14,27,${Math.max(.14, .66 / (1 + v * 1.7))})`; ctx.fillRect(0, 0, W, H);   // rastro: mais longo em alta velocidade
      const F = Math.min(W, H * 1.4) * .64, cx = W / 2 + ax * 28, cy = H * .46 + ay * 16;

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, F * .42);                                  // luz da estação ao fundo
      g.addColorStop(0, 'rgba(200,230,252,.6)'); g.addColorStop(.3, 'rgba(58,147,221,.26)'); g.addColorStop(1, 'rgba(58,147,221,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      const s0 = F / .34, f0 = cy + .86 * s0;                                                           // trilhos e luzes de teto convergindo
      const reta = (x1, y1, cor) => { const l = ctx.createLinearGradient(x1, y1, cx, cy); l.addColorStop(0, `rgba(${cor},.55)`); l.addColorStop(1, `rgba(${cor},0)`); ctx.strokeStyle = l; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(cx, cy); ctx.stroke(); };
      reta(cx - .46 * s0, f0, '168,196,223'); reta(cx + .46 * s0, f0, '168,196,223');
      reta(cx - .78 * 1.5 * s0, cy - .98 * s0, '255,246,200'); reta(cx + .78 * 1.5 * s0, cy - .98 * s0, '255,246,200');

      for (let i = N; i >= 0; i--) {
        const d = i * GAP + (GAP - off) + .34, s = F / d, hw = 1.5 * s, hh = s, a = Math.pow(Math.max(0, 1 - d / (N * GAP)), 1.35);
        if (a < .01) continue;
        ctx.lineWidth = Math.max(.7, s * .024); ctx.strokeStyle = `rgba(${Math.round(90 + 90 * a)},${Math.round(150 + 60 * a)},${Math.round(210 + 30 * a)},${a * .85})`;
        caixa(cx - hw, cy - hh, hw * 2, hh * 2, hh * .36); ctx.stroke();
        luz(cx - hw * .78, cy - hh * .98, s * .02, '255,246,200', a); luz(cx + hw * .78, cy - hh * .98, s * .02, '255,246,200', a);
        ctx.lineWidth = Math.max(.8, s * .03); ctx.strokeStyle = `rgba(75,130,190,${a * .85})`;                // dormentes
        ctx.beginPath(); ctx.moveTo(cx - .64 * s, cy + .86 * s); ctx.lineTo(cx + .64 * s, cy + .86 * s); ctx.stroke();
        if ((i + idx) % 7 === 0) luz(cx - hw * .97, cy - hh * .12, s * .016, '255,184,77', Math.min(1, a * 1.3));                 // sinal âmbar na parede
        else if ((i + idx) % 7 === 3) luz(cx + hw * .97, cy - hh * .12, s * .016, '61,220,151', Math.min(1, a * 1.2));        // sinal verde
      }
    };
    const laco = (ms) => { if (!vivo) return; const dt = Math.min(.05, (ms - ult) / 1000 || .016); ult = ms; quadro(dt); requestAnimationFrame(laco); };

    ajusta(); window.addEventListener('resize', () => { ajusta(); if (REDUZ) quadro(.016); });
    window.addEventListener('pointermove', (e) => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; }, { passive: true });
    document.addEventListener('visibilitychange', () => { vivo = !document.hidden && !REDUZ; if (vivo) { ult = performance.now(); requestAnimationFrame(laco); } });
    document.addEventListener('embarque', (e) => { alvo = e.detail ? 4.8 : .12; k = e.detail ? 2.4 : 1.4; });
    if (REDUZ) quadro(.016); else requestAnimationFrame(laco);
  })();

  /* Painel de partidas: as letras viram até assentar, como nos painéis das estações */
  (() => {
    const linhas = [...document.querySelectorAll('.flap-linha')]; if (linhas.length < 2) return;
    const ALF = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÇÃÕÉÍÓÚ0123456789·-';
    linhas.forEach((l) => { for (let i = 0; i < +l.dataset.n; i++) { const c = document.createElement('span'); c.className = 'cel'; c.textContent = '\u00a0'; l.append(c); } });
    const escreve = (linha, texto, atraso = 0) => {
      const cels = [...linha.children], t = texto.toUpperCase().padEnd(cels.length, ' ').slice(0, cels.length);
      cels.forEach((c, i) => {
        const fim = t[i] === ' ' ? '\u00a0' : t[i]; if (c.textContent === fim) return;
        if (REDUZ) { c.textContent = fim; return; }
        const passo = (n) => {
          c.classList.remove('vira'); void c.offsetWidth; c.classList.add('vira');
          setTimeout(() => { c.textContent = n <= 0 ? fim : ALF[Math.floor(Math.random() * ALF.length)]; }, 120);
          if (n > 0) setTimeout(() => passo(n - 1), 170);
        };
        setTimeout(() => passo(3 + Math.floor(Math.random() * 5)), atraso + i * 55);
      });
    };
    const mostra = (a, b, atraso) => { escreve(linhas[0], a, atraso); escreve(linhas[1], b, atraso + 250); };
    const lemas = ['CONTROLADORIA TRILHA', 'TUDO EM UM SÓ TRILHO']; let n = 0, embarcando = false;
    mostra('PRÓXIMA PARADA', lemas[0], 700);
    setInterval(() => { if (embarcando || document.hidden) return; n = (n + 1) % lemas.length; escreve(linhas[1], lemas[n]); }, 9000);
    document.addEventListener('embarque', (e) => {
      embarcando = !!e.detail;
      if (embarcando) mostra('ATENÇÃO', 'TREM PARTINDO...', 0); else mostra('PRÓXIMA PARADA', lemas[n], 0);
    });
    const rel = document.getElementById('relogio');
    const hora = () => { if (rel) rel.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
    hora(); setInterval(hora, 15000);
  })();

  /* Enquanto as portas ainda estão fechando/abrindo, o cartão não recebe foco nem cliques */
  (() => {
    const card = document.querySelector('.login-card'); if (!card || REDUZ) return;
    card.inert = true; setTimeout(() => { card.inert = false; }, 4800);
  })();
</script>
