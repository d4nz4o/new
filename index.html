<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Participações | Controladoria - Login</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.png">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body.login-page {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .login-header {
      margin-bottom: 2rem;
    }

    .login-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .login-logo:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

    .login-subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin: 0;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .btn-google:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .login-footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .error-message {
      display: none;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <img 
        src="assets/images/logo.png" 
        alt="Trilha Participações" 
        class="login-logo"
        onclick="window.location.href='index.html'"
      />
      <p class="login-subtitle">Acesse o sistema com a sua conta corporativa.</p>
    </div>

    <!-- Mensagem de erro -->
    <div id="mensagemErro" class="error-message"></div>

    <button type="button" class="btn-google" onclick="fazerLoginComGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Entrar com o Google
    </button>

    <div class="login-footer">
      Sistema interno criado pela Controladoria da Trilha.
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://luujxgjjkbppjbefllsg.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_eziJVLtciOqcihK-lLCfnw_ZGK72sFh";

  let sbClient = null;
  try {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  } catch (err) {
    console.error("Erro ao inicializar o Supabase:", err);
  }

  async function fazerLoginComGoogle() {
    if (!sbClient) {
      exibirErro("Erro ao conectar ao serviço de autenticação.");
      return;
    }

    // Redireciona o utilizador logado diretamente para hub.html
    const urlRedirecionamento = window.location.origin + window.location.pathname.replace('index.html', 'hub.html');

    const { data, error } = await sbClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: urlRedirecionamento
      }
    });

    if (error) {
      console.error("Erro na autenticação:", error.message);
      exibirErro("Falha ao iniciar o login com o Google. Tente novamente.");
    }
  }

  function exibirErro(mensagem) {
    const elErro = document.getElementById('mensagemErro');
    if (elErro) {
      elErro.innerText = mensagem;
      elErro.style.display = 'block';
    }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('erro') === 'dominio_invalido') {
      exibirErro("Acesso negado: utilize uma conta corporativa da Trilha.");
    }

    if (sbClient) {
      const { data: { session } } = await sbClient.auth.getSession();
      
      if (session) {
        const email = session.user.email || "";

        if (!email.endsWith("@triviatrens.com.br")) {
          await sbClient.auth.signOut();
          exibirErro("Acesso negado: utilize uma conta corporativa da Trilha.");
          return;
        }

        // Se estiver autenticado e com e-mail correto, envia para o painel (hub.html)
        window.location.href = "hub.html";
      }
    }
  });
</script>
</body>
</html>
